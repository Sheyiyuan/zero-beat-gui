<g transform="translate(1344 305) scale(0.8333333333333334)" fill="none" stroke="#CCBBC4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></g>
<text x="738" y="395" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">点击作者进入主页 · Esc 关闭</text>
