<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">零拍 · 关键状态与双端交互</title><desc id="desc">零拍图形客户端静态设计预览。所有歌曲、人物、评论和封面均为虚构示例，非已上线功能。</desc>
<rect x="0" y="0" width="1440" height="1100" rx="0" fill="#191418"/>
<text x="40" y="56" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#F4E9EF">每一步，都有下一步</text>
<text x="40" y="86" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#CCBBC4">关键状态与交互 · 静态设计说明 · 虚构示例</text>
<rect x="40" y="122" width="650" height="354" rx="12" fill="#241E23" stroke="#53424C" stroke-width="1"/>
<text x="64" y="159" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#F4E9EF">设置 / 同步</text>
<text x="64" y="197" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#F4E9EF">歌单与歌曲注释</text>
<text x="64" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">已连接同步仓库 · 最近同步 14:32</text>
<rect x="534" y="183" width="132" height="40" rx="8" fill="#241E23" stroke="#53424C" stroke-width="1"/>
<g transform="translate(547 193.0) scale(0.8333333333333334)" fill="none" stroke="#F4E9EF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 0 1 16-5l2 3M21 2v6h-6M21 14a9 9 0 0 1-16 5l-2-3M3 22v-6h6"/></g>
<text x="610.0" y="208.0" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#F4E9EF">立即同步</text>
<path d="M64 248H666" fill="none" stroke="#53424C" stroke-width="1"/>
<text x="64" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#F4E9EF">同步登录状态</text>
<rect x="610" y="262" width="52" height="28" rx="14" fill="#53424C"/>
<circle cx="624" cy="276" r="10" fill="#241E23"/>
<text x="64" y="311" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">已关闭 · 不上传或导入登录状态</text>
<text x="64" y="345" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">开启后，将加密同步各音源的登录状态。</text>
<text x="64" y="370" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">每台设备都需要单独开启，并设置相同口令。</text>
<text x="64" y="410" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">关闭登录态同步时，歌单同步无需解锁。</text>
<text x="64" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#CCBBC4">关闭不会删除远端已有记录。</text>
<rect x="714" y="122" width="686" height="354" rx="12" fill="#241E23" stroke="#53424C" stroke-width="1"/>
