name: zero_beat_gui
description: 零拍图形客户端。Linux 桌面与 Android 共用同一套播放状态。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  media_kit: ^1.2.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_android_audio: ^1.3.0
  audio_service: ^0.18.16
  audio_session: ^0.1.25
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  zero_beat_core:
    path: ../packages/zero_beat_core
  zero_beat_rpc:
    path: ../packages/zero_beat_rpc
  qr_flutter: ^4.1.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  tray_manager: ^0.5.3
  file_selector: ^1.1.0
  screen_retriever: ^0.2.2
  share_plus: ^13.3.1
  flutter_svg: ^2.3.4
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.png
    - assets/appicon.png
    - assets/brands/bilibili.svg
    - assets/brands/netease.svg
